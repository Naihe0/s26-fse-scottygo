<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#86142b" />
    <title>ScottyGo - Saved routes</title>
    <link rel="stylesheet" href="../styles/shared.css" />
    <link rel="stylesheet" href="../styles/subscriptions.css" />
  </head>
  <body>
    <app-header back></app-header>
    <main class="content">
      <h1 class="page-title" id="page-title">Saved routes</h1>
      <p class="page-intro"
        >Your everyday routes, together. Manage popups while ScottyGo is
        open.</p
      >
      <div class="subscription-state">
        <p id="subscription-status" role="status" aria-live="polite"
          >Loading your saved routes…</p
        >
        <button id="subscriptions-retry" class="state-retry" hidden
          >Try again</button
        >
      </div>
      <details class="saved-route-options" id="saved-route-options" hidden>
        <summary>Filter and sort routes</summary>
        <div class="saved-route-fields">
          <label
            >Alerts<select id="saved-alert-scope"
              ><option value="all">All saved routes</option
              ><option value="muted">Muted routes</option
              ><option value="enabled">Alerts enabled</option></select
            ></label
          >
          <label
            >Order<select id="saved-route-order"
              ><option value="saved">Saved order</option
              ><option value="route">Route number</option
              ><option value="recent">Latest rider report</option></select
            ></label
          >
        </div>
      </details>
      <ul class="subscription-list" id="subscription-list"></ul>
      <section
        class="subscription-undo"
        id="subscription-undo"
        hidden
        aria-live="polite"
      >
        <span id="subscription-undo-label"></span>
        <button type="button" id="undo-remove-btn">Undo removal</button>
      </section>
      <button class="add-route-btn" id="add-route-btn" disabled>
        <span>+ Add route</span>
        <span class="add-route-divider">|</span>
        <span id="route-count"></span>
      </button>
    </main>

    <div class="sheet-overlay" id="sheet-overlay"></div>
    <div
      class="bottom-sheet"
      id="bottom-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheet-title"
      inert
    >
      <div class="sheet-handle"></div>
      <button
        type="button"
        id="sheet-close"
        class="sheet-close"
        aria-label="Close add route dialog"
        >Close</button
      >
      <h2 class="sheet-title" id="sheet-title">Add a route</h2>
      <div class="sheet-search">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          id="route-search-input"
          placeholder="Search routes..."
          aria-label="Search routes to subscribe"
          autocomplete="off"
        />
      </div>
      <div class="saved-route-fields sheet-browse">
        <label
          >Transit system<select id="sheet-system"
            ><option value="all">All systems</option
            ><option value="PRT">PRT buses</option
            ><option value="CMU">CMU shuttles</option></select
          ></label
        >
        <label class="sheet-unsaved"
          ><input type="checkbox" id="sheet-unsaved" /> Hide saved routes</label
        >
      </div>
      <p id="sheet-status" class="sheet-status" role="status"></p>
      <button id="routes-retry" class="state-retry" hidden>Try again</button>
      <ul class="sheet-results" id="sheet-results"></ul>
      <p id="sheet-feedback" class="sheet-feedback" role="status"></p>
    </div>

    <script type="module" src="../scripts/subscriptions.ts"></script>
  </body>
</html>
