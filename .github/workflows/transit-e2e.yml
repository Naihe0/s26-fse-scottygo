name: Transit Live E2E

on:
  workflow_dispatch:
  schedule:
    # Nightly at 07:00 UTC
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  transit-e2e:
    name: Transit E2E (Live Upstream Dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8.0
        ports: ['27019:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 10s --health-timeout 5s --health-retries 10


    steps:
      - name: Check out repository code...
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Clean install npm...
        run: npm ci

      - name: Run live transit E2E suite...
        env:
          RUN_TRANSIT_E2E: 'true'
          TRUETIME_KEY: ${{ secrets.TRUETIME_KEY }}
        run: npm run test:rest:e2e:transitAPI
