name: CI-CD

on:
  push:
    branches: [main, codex/render-atlas-setup]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    name: Check, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8.0
        ports: ['27019:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 10s --health-timeout 5s --health-retries 10


    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:paths
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Jest refuses remote DBs and real credentials. Live upstream tests are opt-in.
      - run: npm run test:ci
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Original main deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integrate
    runs-on: ubuntu-latest
    env:
      SRV_ID: ${{ secrets.SRV_ID }}
      SRV_KEY: ${{ secrets.SRV_KEY }}
      SRV_TK: ${{ secrets.SRV_TK }}
    steps:
      # Preserve the original main deployment; the personal service tracks its own branch.
      - name: Invoke existing Render hook
        run: curl --fail --silent --show-error "https://api.render.com/deploy/${{ env.SRV_ID }}?key=${{ env.SRV_KEY }}"
      - name: Wait for original Render deployment
        uses: bounceapp/render-action@0.8.0
        with:
          service-id: ${{ env.SRV_ID }}
          render-token: ${{ env.SRV_TK }}
          github-token: ${{ github.token }}
          retries: 50
          wait: 3000
          sleep: 0
